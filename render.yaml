# Render Blueprint for GTMS. Data lives in Supabase Postgres. Set DATABASE_URL
# in the dashboard. JWT_SECRET is auto-generated by Render.
services:
  - type: web
    name: gtms
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false            # paste your Supabase connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true    # Render creates a strong secret automatically
      - key: ADMIN_PASSWORD
        sync: false            # set your admin password in the dashboard
      - key: GUARD_PASSWORD
        sync: false            # set your guard password in the dashboard
      - key: DEFAULT_MANAGER_EMAIL
        value: security.manager@company.com
      - key: DEFAULT_REPORT_TIME
        value: "07:00"
      # --- Email (optional): fill to send real mail; blank = demo preview links ---
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_PORT
      #   value: "465"
      # - key: SMTP_SECURE
      #   value: "true"
      # - key: SMTP_USER
      #   sync: false
      # - key: SMTP_PASS
      #   sync: false
      # - key: MAIL_FROM
      #   value: "GTMS Security <gtms@yourcompany.com>"
